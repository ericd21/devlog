[project]
name = "devlog"
version = "0.1.0"
description = "A local-first MCP server for keeping a personal engineering journal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
client = [
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
packages = ["devlog"]
